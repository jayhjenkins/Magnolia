# Which external tools this operator uses. Onboarding fills these in.
project_management:
  provider: "none"       # jira | asana | linear | none
  jira:
    cloud_id: ""         # e.g. yourorg.atlassian.net
    project_key: ""      # e.g. ABC
    component_id: ""
    auto_label: ""
    default_assignee: "" # Jira accountId
    board_id: ""         # e.g. 1096 — the team's Jira board id
    product_area: ""     # display name of the board lane that auto_label routes to
    unlabeled_lane: ""   # name of the lane issues with no labels land in (optional)
    conventions: ""      # free-form team nuance the factory captures (e.g. "always set Sprint")
    fields:              # this site's custom-field ids (customfield_NNNNN); empty = omit
      epic_name: ""          # Epic Name (sent for Epics only)
      ga_date: ""            # GA / GTM date (Features and Epics)
      ea_date: ""            # Early Access date (Features and Epics)
      spec_reference: ""     # spec / PRD link (Features and Epics)
      client_commitment: ""  # client commitment flag (Features and Epics)
      release_notes: ""      # release-notes select field
      severity: ""           # bug Severity select field (bug-severity write-back)
    email: ""            # Atlassian account email for REST API auth
    api_token: ""        # Jira API token (id.atlassian.com > Security > API tokens)
transcript:
  provider: "none"       # otter | granola | none
  target: "datasets/meetings/"
calendar:
  provider: "none"       # m365 | google | none
messaging:
  provider: "none"       # m365 | none — set m365 to enable Outlook + Teams sends (via mgc)
  m365:
    confirmed: false     # Tier-2 gate: one plain-language confirm before the first send
doc_sync:
  onedrive_root: ""      # your synced OneDrive folder; auto-detected by the Doctor
  sharepoint_site: "PM-OS"
  enabled: false
analytics:
  pendo:
    provider: "none"      # pendo | none
    subscription_id: ""
    app_ids: {}           # name -> Pendo appId, e.g. {default: "123"}
  databricks:
    provider: "none"      # databricks | none
    catalog: ""
    sources: {}           # logical source -> schema, e.g. {gong: "gongio"}
