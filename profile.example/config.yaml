# Engine behavior knobs.
models:
  judge: "claude-opus-4-8"
  parser: "claude-haiku-4-5"
  cost_posture: "balanced"   # low | balanced | high
# CLI harness: which headless CLI to use for LLM dispatch.
# claude (default) | codex
harness: "claude"
active_skill_packs: ["core"]
# server.port is NOT seeded here: the `magnolia` launcher picks a free port on
# first run and records it in profile/config.yaml (server.port).
# Autonomous Mode: when true, action-types graduated to the 'autonomous' tier
# auto-ship their terminal action (send / publish) without a per-instance approve.
# Default off — opt-in via the top-bar settings cog.
autonomy_enforcement: false
